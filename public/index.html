<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agon</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="barra">
  <span class="logo">Agon</span>
  <span id="chi" class="barra-info"></span>
</header>

<main class="contenuto stretto">

  <!-- 1. lo studente scrive il nome -->
  <section id="schermata-nome" class="schermata">
    <p class="etichetta">Quiz live</p>
    <h1>Come ti chiami?</h1>
    <form id="form-nome" class="riga-form">
      <input id="campo-nome" class="campo" maxlength="20" placeholder="Il tuo nome" autocomplete="off">
      <button class="bottone">Entra</button>
    </form>
    <p id="errore" class="errore"></p>
  </section>

  <!-- 2. sala d'attesa -->
  <section id="schermata-attesa" class="schermata" hidden>
    <p class="etichetta">Sei dentro</p>
    <h1>Aspetta il docente</h1>
    <p class="testo-secondario">Il quiz parte quando il docente lo avvia.</p>
    <p id="in-sala" class="testo-secondario"></p>
  </section>

  <!-- 3. domanda in corso -->
  <section id="schermata-domanda" class="schermata" hidden>
    <div class="riga-spazio">
      <p id="numero" class="etichetta"></p>
      <p id="tempo" class="tempo"></p>
    </div>
    <h2 id="testo"></h2>
    <div id="risposte" class="risposte"></div>
    <p id="inviata" class="testo-secondario" hidden>Risposta inviata, aspetta gli altri…</p>
  </section>

  <!-- 4. risultato della domanda -->
  <section id="schermata-risultato" class="schermata" hidden>
    <h1 id="esito"></h1>
    <p id="guadagno" class="numero-grande"></p>
    <p id="posizione" class="testo-secondario"></p>
  </section>

  <!-- 5. fine del quiz -->
  <section id="schermata-fine" class="schermata" hidden>
    <p class="etichetta">Quiz finito</p>
    <h1 id="finale"></h1>
    <ol id="classifica" class="classifica"></ol>
  </section>

</main>

<script>
  // [WS] mi collego al server WebSocket: stesso indirizzo della pagina,
  // con ws:// al posto di http:// (come negli esercizi in classe)
  const webSocket = new WebSocket(location.origin.replace(/^http/, 'ws'));

  let mioNome = null;     // diventa il nome quando il server conferma l'entrata
  let miaScelta = null;   // risposta data alla domanda in corso
  let conto = null;       // setInterval del conto alla rovescia

  // [JS] mostra una sola schermata e nasconde le altre
  function mostra(nome) {
    document.querySelectorAll('.schermata').forEach((s) => {
      s.hidden = s.id !== 'schermata-' + nome;
    });
  }

  // [WS] ogni messaggio è un oggetto trasformato in stringa JSON
  function manda(msg) {
    webSocket.send(JSON.stringify(msg));
  }

  // il nome usato l'ultima volta, così dopo un refresh basta premere Entra
  try { document.getElementById('campo-nome').value = localStorage.getItem('agon-nome') || ''; } catch {}

  document.getElementById('form-nome').addEventListener('submit', (event) => {
    event.preventDefault();   // il form non deve ricaricare la pagina
    manda({ type: 'entra', nome: document.getElementById('campo-nome').value });
  });

  // ---------------------------------------------------------------
  // Schermate
  // ---------------------------------------------------------------

  function mostraDomanda(data) {
    miaScelta = null;
    document.getElementById('numero').textContent = 'Domanda ' + data.numero + ' di ' + data.totale;
    document.getElementById('testo').textContent = data.testo;
    document.getElementById('inviata').hidden = true;

    // [JS] creo un bottone per ogni risposta: vale sia per 4 risposte sia per Vero/Falso
    const contenitore = document.getElementById('risposte');
    contenitore.innerHTML = '';
    contenitore.className = 'risposte ' + data.tipo;
    data.risposte.forEach((risposta, i) => {
      const bottone = document.createElement('button');
      bottone.className = 'risposta r' + i;
      bottone.textContent = risposta;
      bottone.addEventListener('click', () => {
        miaScelta = i;
        manda({ type: 'risposta', scelta: i });
        contenitore.querySelectorAll('button').forEach((b) => (b.disabled = true));
        bottone.classList.add('scelta');
        document.getElementById('inviata').hidden = false;
      });
      contenitore.appendChild(bottone);
    });

    // conto alla rovescia solo da mostrare: il tempo vero lo decide il server
    let secondi = data.tempo;
    const tempo = document.getElementById('tempo');
    tempo.textContent = secondi;
    clearInterval(conto);
    conto = setInterval(() => {
      secondi = Math.max(0, secondi - 1);
      tempo.textContent = secondi;
    }, 1000);

    mostra('domanda');
  }

  function mostraRisultato(data) {
    clearInterval(conto);
    const esito = document.getElementById('esito');
    if (miaScelta === null) {
      esito.textContent = 'Tempo scaduto';
      esito.className = 'sbagliato';
    } else if (miaScelta === data.corretta) {
      esito.textContent = 'Giusto!';
      esito.className = 'giusto';
    } else {
      esito.textContent = 'Sbagliato';
      esito.className = 'sbagliato';
    }

    // [JS] cerco la mia riga in classifica con find e la posizione con findIndex
    const posizione = data.classifica.findIndex((g) => g.nome === mioNome);
    const io = data.classifica[posizione];
    document.getElementById('guadagno').textContent = '+' + io.guadagno;
    document.getElementById('posizione').textContent =
      'Sei ' + (posizione + 1) + '° con ' + io.punti + ' punti';
    mostra('risultato');
  }

  function mostraFine(data) {
    clearInterval(conto);
    const posizione = data.classifica.findIndex((g) => g.nome === mioNome);
    document.getElementById('finale').textContent =
      'Sei arrivato ' + (posizione + 1) + '° su ' + data.classifica.length;

    const lista = document.getElementById('classifica');
    lista.innerHTML = '';
    data.classifica.forEach((g) => {
      const riga = document.createElement('li');
      if (g.nome === mioNome) riga.className = 'io';
      riga.innerHTML = '<span></span><strong></strong>';
      riga.children[0].textContent = g.nome;   // textContent: il nome non viene letto come HTML
      riga.children[1].textContent = g.punti;
      lista.appendChild(riga);
    });
    mostra('fine');
  }

  // ---------------------------------------------------------------
  // Messaggi dal server
  // ---------------------------------------------------------------

  // [WS] onmessage: event.data è la stringa JSON mandata dal server
  webSocket.onmessage = (event) => {
    const data = JSON.parse(event.data);

    if (data.type === 'errore') {
      document.getElementById('errore').textContent = data.testo;
      return;
    }

    if (data.type === 'entrato') {
      mioNome = data.nome;
      try { localStorage.setItem('agon-nome', mioNome); } catch {}
      document.getElementById('chi').textContent = mioNome;
      return;
    }

    // finché non sono entrato ignoro i messaggi della partita
    if (mioNome === null) return;

    if (data.type === 'giocatori') {
      document.getElementById('in-sala').textContent = data.giocatori.length + ' in sala';
    }
    if (data.type === 'attesa') mostra('attesa');
    if (data.type === 'domanda') mostraDomanda(data);
    if (data.type === 'risultato') mostraRisultato(data);
    if (data.type === 'fine') mostraFine(data);
  };

  // [WS] onclose: il server è stato spento o la rete è caduta
  webSocket.onclose = () => {
    document.getElementById('chi').textContent = 'Disconnesso';
  };
</script>
</body>
</html>
