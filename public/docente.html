<!DOCTYPE html>
<!-- data-theme="light": le pagine del docente vanno al proiettore, sempre in tema chiaro -->
<html lang="it" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agon · I quiz</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:,">
</head>
<body>

<header class="barra">
  <span class="logo">Agon</span>
  <span class="barra-info">
    <span id="nome-docente"></span>
    <button id="esci" class="bottone piccolo secondario">Esci</button>
  </span>
</header>

<main class="contenuto">

  <div class="riga-spazio">
    <div class="intestazione">
      <p class="etichetta">Area docente</p>
      <h1>I quiz</h1>
    </div>
    <a href="/editor" class="bottone grande">Nuovo quiz</a>
  </div>

  <!-- i quiz del docente collegato -->
  <section class="sezione-quiz">
    <h2>I tuoi quiz</h2>
    <div id="miei" class="griglia-quiz"></div>
    <p id="miei-vuoto" class="testo-secondario" hidden>Non hai ancora creato quiz. Premi "Nuovo quiz" per iniziare.</p>
  </section>

  <!-- i quiz degli altri docenti: si possono avviare ma non modificare -->
  <section class="sezione-quiz">
    <h2>Quiz degli altri docenti</h2>
    <div id="altri" class="griglia-quiz"></div>
    <p id="altri-vuoto" class="testo-secondario" hidden>Nessun altro docente ha ancora creato quiz.</p>
  </section>

  <p id="errore" class="errore"></p>

</main>

<script src="effetti.js"></script>
<script src="sessione.js"></script>
<script>
  // [JS] crea la scheda di un quiz: nome, quante domande, tempo e pulsanti
  function schedaQuiz(q, i) {
    const scheda = document.createElement('article');
    scheda.className = 'scheda-quiz';
    scheda.style.setProperty('--i', i);   // entrata a cascata (CSS)
    scheda.innerHTML =
      '<div class="scheda-tessere" aria-hidden="true"><span></span><span></span><span></span><span></span></div>' +
      '<h3 class="t-sottotitolo"></h3>' +
      '<p class="t-piccolo testo-secondario"></p>' +
      '<div class="pulsanti"></div>';
    scheda.querySelector('h3').textContent = q.nome;
    scheda.querySelector('p').textContent =
      q.numeroDomande + (q.numeroDomande === 1 ? ' domanda' : ' domande') +
      ' · ' + q.tempo + ' s' + (q.mio ? '' : ' · di ' + q.autore);

    const pulsanti = scheda.querySelector('.pulsanti');

    // Avvia: apre la pagina della partita, che crea il PIN
    const avvia = document.createElement('a');
    avvia.className = 'bottone';
    avvia.href = '/conduci?quiz=' + q.id;
    avvia.textContent = 'Avvia';
    pulsanti.appendChild(avvia);

    if (q.mio) {
      const modifica = document.createElement('a');
      modifica.className = 'bottone secondario';
      modifica.href = '/editor?quiz=' + q.id;
      modifica.textContent = 'Modifica';
      pulsanti.appendChild(modifica);

      // Elimina in due tempi: il primo clic chiede conferma, il secondo elimina
      const elimina = document.createElement('button');
      elimina.className = 'bottone secondario';
      elimina.textContent = 'Elimina';
      // conferma è null finché non si clicca; dopo il primo clic contiene il
      // setTimeout che fra 3 secondi riporta il bottone a "Elimina"
      let conferma = null;
      elimina.addEventListener('click', async () => {
        if (!conferma) {
          elimina.textContent = 'Sicuro?';
          elimina.classList.add('pericolo');
          conferma = setTimeout(() => {
            elimina.textContent = 'Elimina';
            elimina.classList.remove('pericolo');
            conferma = null;
          }, 3000);
          return;
        }
        clearTimeout(conferma);
        await scheda.animate(
          [{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'scale(0.9)' }],
          { duration: movimentoRidotto ? 1 : 250, easing: 'ease-in', fill: 'forwards' }
        ).finished;
        const risposta = await api('/quiz/' + q.id, { method: 'DELETE' });   // DELETE /quiz/:id
        if (!risposta.ok) {
          document.getElementById('errore').textContent = (await risposta.json()).errore;
        }
        caricaQuiz();
      });
      pulsanti.appendChild(elimina);
    }
    return scheda;
  }

  // [JS] GET /quiz con il token: l'elenco arriva già diviso tra "mio" e degli altri
  async function caricaQuiz() {
    const risposta = await api('/quiz');
    if (!risposta.ok) return;
    const elenco = await risposta.json();

    const miei = elenco.filter((q) => q.mio);
    const altri = elenco.filter((q) => !q.mio);

    // map chiama schedaQuiz(q, i) per ogni quiz (i = posizione, serve per la cascata)
    // e restituisce un array di schede; i tre puntini "..." le passano una per una
    // a replaceChildren, che toglie le schede vecchie e mette le nuove
    document.getElementById('miei').replaceChildren(...miei.map(schedaQuiz));
    document.getElementById('altri').replaceChildren(...altri.map(schedaQuiz));
    document.getElementById('miei-vuoto').hidden = miei.length > 0;
    document.getElementById('altri-vuoto').hidden = altri.length > 0;
  }

  caricaQuiz();
</script>
</body>
</html>
